name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  # ─── Job 1: Lint & Test the Server ───────────────────────────────────
  server-test:
    name: 🧪 Server — Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: 📦 Install server dependencies
        run: npm ci
        working-directory: server

      - name: 🔍 Run ESLint
        run: npm run lint
        working-directory: server

      - name: 🧪 Run tests
        run: npm run test:ci
        working-directory: server

      - name: 📊 Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: server/coverage/
          retention-days: 7

  # ─── Job 2: Build the React Client ──────────────────────────────────
  client-build:
    name: 🏗️ Client — Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: 📦 Install client dependencies
        run: npm ci
        working-directory: client

      - name: 🏗️ Build React app
        run: npm run build
        working-directory: client

  # ─── Job 3: Validate Docker Build ───────────────────────────────────
  docker-build:
    name: 🐳 Docker — Build Validation
    runs-on: ubuntu-latest
    needs: [server-test, client-build]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Build server Docker image
        run: docker build -t wool-server:ci ./server

      - name: 🐳 Build client Docker image
        run: docker build -t wool-client:ci ./client
